<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News to video</title>
<style>
  :root { --bg: #0b0d12; --panel: #151923; --line: #2a3040; --text: #f2f4f8; --muted: #8b93a7; --accent: #a78bfa; --ok: #6ee7b7; --err: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 1400px; margin: auto; padding: 28px; }
  h1 { margin: 0; font-size: 40px; } .sub { color: var(--muted); margin: 2px 0 22px; }
  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  input { flex: 1; min-width: 260px; } button { background: var(--accent); color: #111; font-weight: 600; cursor: pointer; border: 0; }
  button:disabled { opacity: .5; cursor: wait; }
  #timer { font: 600 28px ui-monospace, monospace; min-width: 90px; text-align: right; }
  .grid { display: grid; grid-template-columns: 1fr 420px; gap: 28px; margin-top: 24px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border-radius: 16px; padding: 20px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  li.run { color: var(--text); } li.run::before { content: "◌ "; } li.ok { color: var(--ok); } li.ok::before { content: "✓ "; }
  li span:first-child { flex: 1; } li small { color: var(--muted); }
  #title { font-size: 26px; font-weight: 700; margin: 18px 0 4px; } #narration { color: var(--muted); }
  .clips { display: flex; gap: 12px; margin-top: 16px; }
  .clip { flex: 1; aspect-ratio: 9 / 16; background: #0f1219; border: 1px dashed var(--line); border-radius: 12px; overflow: hidden;
          display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; text-align: center; }
  .clip video { width: 100%; height: 100%; object-fit: cover; }
  #final { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 14px; }
  td { padding: 6px 2px; border-top: 1px solid var(--line); } td code { color: var(--muted); font-size: 12px; word-break: break-all; }
  .num { text-align: right; white-space: nowrap; } tfoot td { font-weight: 700; color: var(--ok); }
  #error { color: var(--err); margin-top: 12px; } a { color: var(--accent); }
  #sources { font-size: 14px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>News to video</h1>
  <div class="sub">Tavily · Nebius · Pruna · Gradium — one API key via Eden AI</div>
  <form onsubmit="event.preventDefault(); generate()">
    <input id="topic" placeholder="A topic, e.g. European AI startups" required>
    <select id="model"></select>
    <button id="go">Generate</button>
    <div id="timer">0.0 s</div>
  </form>
  <div id="error"></div>
  <div class="grid">
    <section class="panel">
      <ol>
        <li id="s-search" data-who="Tavily"><span>Search today's web</span><small>Tavily</small></li>
        <li id="s-script" data-who="Nebius"><span>Write headline, narration and 3 shots</span><small>Nebius</small></li>
        <li id="s-clips" data-who="Pruna"><span>Render 3 clips in parallel</span><small>Pruna</small></li>
        <li id="s-voice" data-who="Gradium"><span>Record the narration</span><small>Gradium</small></li>
        <li id="s-stitch" data-who="ffmpeg"><span>Stitch the 9:16 video</span><small>ffmpeg</small></li>
      </ol>
      <div id="title"></div>
      <div id="narration"></div>
      <div class="clips"><div class="clip" id="c0">clip 1</div><div class="clip" id="c1">clip 2</div><div class="clip" id="c2">clip 3</div></div>
    </section>
    <aside class="panel">
      <video id="final" controls playsinline></video>
      <table><tbody id="steps"></tbody><tfoot id="total"></tfoot></table>
      <div id="sources"></div>
    </aside>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
fetch("/api/models").then((r) => r.json()).then((m) => ($("model").innerHTML = m.map((x) => `<option>${x}</option>`).join("")));

let started, ticker, folder, clipsDone;
const step = (id, state, note = "") => {  // state: "" pending, "run", "ok"
  $(id).className = state;
  $(id).querySelector("small").textContent = note || $(id).dataset.who;
};
const host = (u) => { try { return new URL(u).hostname; } catch { return u; } };
const at = () => `${((performance.now() - started) / 1000).toFixed(1)} s`;

async function generate() {
  ["s-search", "s-script", "s-clips", "s-voice", "s-stitch"].forEach((id) => step(id, ""));
  ["title", "narration", "error", "sources", "steps", "total"].forEach((id) => ($(id).innerHTML = ""));
  [0, 1, 2].forEach((i) => ($(`c${i}`).textContent = `clip ${i + 1}`));
  $("final").removeAttribute("src"); $("final").load();
  $("go").disabled = true; clipsDone = 0; started = performance.now();
  ticker = setInterval(() => ($("timer").textContent = at()), 100);

  const form = new FormData();
  form.append("topic", $("topic").value);
  form.append("video_model", $("model").value);
  try {
    const r = await fetch("/api/run", { method: "POST", body: form });
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {  // one JSON event per line
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) { handle(JSON.parse(buffer.slice(0, nl))); buffer = buffer.slice(nl + 1); }
    }
  } catch (e) { handle({ event: "error", message: e.message }); }
  clearInterval(ticker); $("timer").textContent = at(); $("go").disabled = false;
}

function handle(e) {
  switch (e.event) {
    case "searching": folder = e.folder; step("s-search", "run"); break;
    case "writing": step("s-search", "ok", `${e.results} results · ${at()}`); step("s-script", "run"); break;
    case "script":
      step("s-script", "ok", at()); step("s-clips", "run", "0/3"); step("s-voice", "run");
      $("title").textContent = e.title; $("narration").textContent = e.narration;
      e.captions.forEach((c, i) => ($(`c${i}`).textContent = `rendering… “${c}”`));
      $("sources").innerHTML = "Sources: " + e.sources.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join(", ");
      break;
    case "clip":
      $(`c${e.index}`).innerHTML = `<video src="/out/${folder}/${e.file}" muted autoplay loop playsinline></video>`;
      clipsDone += 1; step("s-clips", clipsDone === 3 ? "ok" : "run", `${clipsDone}/3 · ${at()}`); break;
    case "narration": step("s-voice", "ok", at()); break;
    case "stitching": step("s-stitch", "run"); break;
    case "done":
      step("s-stitch", "ok", at());
      $("final").src = `/out/${e.folder}/${e.video}`;
      $("final").play().catch(() => {});  // if autoplay is blocked, the controls are there
      $("steps").innerHTML = e.steps.map((s) => `<tr><td>${esc(s.name)}<br><code>${esc(s.model)}</code></td>
        <td class="num">${s.seconds} s</td><td class="num">$${s.cost.toFixed(4)}</td></tr>`).join("");
      $("total").innerHTML = `<tr><td>Total · ${e.seconds} s</td><td></td><td class="num">$${e.cost.toFixed(4)}</td></tr>`;
      $("sources").innerHTML += ` · <a href="/out/${e.folder}/script.md" target="_blank">script.md</a>`;
      break;
    case "error": $("error").textContent = `⚠️ ${e.message}`; break;
  }
}
</script>
</body>
</html>
